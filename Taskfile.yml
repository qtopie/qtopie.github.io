version: '3'

tasks:
  default:
    desc: Start all development services
    cmds:
      - task: dev

  dev:
    desc: Run all dev services (Pre-renders D2 diagrams, then starts Hugo, D2 watcher, React watcher)
    cmds:
      - task: d2:gen
      - task: dev:parallel

  dev:parallel:
    desc: Run dev services in parallel
    deps:
      - task: d2:watch
      - task: react:watch
      - task: hugo

  d2:gen:
    desc: Generate all missing D2 diagrams
    cmds:
      - ./scripts/generate-d2-diagrams.sh

  d2:watch:
    desc: Watch Markdown files and generate D2 diagrams automatically
    watch: true
    sources:
      - content/**/*.md
      - posts/**/*.md
    cmds:
      - ./scripts/generate-d2-diagrams.sh

  hugo:
    desc: Start Hugo server
    cmds:
      - hugo server --minify --disableFastRender --bind localhost

  react:watch:
    desc: Watch and build React app (Theme)
    dir: themes/drift-blog-theme/react-app
    sources:
      - src/**/*
      - vite.config.ts
      - package.json
    cmds:
      - npm run watch

  build:
    desc: Build the React app, D2 diagrams, and Hugo site for production
    cmds:
      - task: build:react
      - task: d2:gen
      - task: build:hugo

  build:react:
    desc: Build React app (Theme)
    dir: themes/drift-blog-theme/react-app
    cmds:
      - npm install
      - npm run build

  build:hugo:
    desc: Generate static Hugo site
    cmds:
      - hugo --minify
